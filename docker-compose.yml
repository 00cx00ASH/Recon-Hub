# Uso:
#   docker compose up -d --build
#   docker compose logs -f reconhub      # pega a URL http://0.0.0.0:7878/#token=...
#                                        # abra no host como http://127.0.0.1:7878/#token=...
#
# O token é gerado no 1º start e persiste no volume reconhub-data (em /app/data/token).
# Para fixar o seu:  RECONHUB_TOKEN=... docker compose up -d   (ou num .env)
#
# Proxy/Tor: o sidecar de Tor sobe SEMPRE junto (SOCKS5 em 127.0.0.1:9050,
# controle em 127.0.0.1:9051 — nenhuma porta exposta pro host, só alcançável
# de dentro do container do hub). Ele fica disponível o tempo todo, mas
# nenhum tráfego passa por ele até você configurar, POR PROGRAMA (aba
# Projetos → Autenticação compartilhada → Proxy), socks5://127.0.0.1:9050 —
# continua opt-in: nada é roteado por Tor sem essa confirmação explícita
# (alguns programas de bug bounty proíbem teste via IP anonimizado). A
# rotação de circuito (trocar de IP após bloqueio) já é automática pra
# ferramentas que suportam RECONHUB_PROXY_URL — ver README > Docker >
# Proxy/Tor pro comando manual de fallback.
#
# Chrome: sidecar de Chrome headless também SEMPRE no ar (CDP em
# 127.0.0.1:9222, mesma exceção de rede do Tor — nada exposto pro host).
# Diferente do Tor, esse aqui NÃO é opt-in: RECONHUB_CHROME_URL abaixo
# aponta toda ferramenta baseada em navegador (scan-xss-dom por enquanto)
# pra ele automaticamente, sem configuração por programa — é infra
# compartilhada, não segredo por programa. Não suporta proxy/Tor por job
# (processo único compartilhado); ver tools/scan-xss-dom/browser.go.

services:
  reconhub:
    build:
      context: .
      # store em arquivos por padrão (zero deps). Para o backend SQLite:
      #   RECONHUB_SQLITE=sqlite docker compose up -d --build
      # e passe -store sqlite abaixo (ou RECONHUB_STORE=sqlite).
      args:
        RECONHUB_SQLITE: "${RECONHUB_SQLITE:-}"
    image: reconhub:local
    container_name: reconhub
    ports:
      - "127.0.0.1:7878:7878"   # só no loopback do host
    volumes:
      - reconhub-data:/app/data
      - reconhub-watches:/app/watches   # pipelines agendadas criadas pela API
      - reconhub-programs:/app/programs # escopo dos projetos criados pela API
    environment:
      RECONHUB_TOKEN: "${RECONHUB_TOKEN:-}"
      RECONHUB_STORE: "${RECONHUB_STORE:-}"
      RECONHUB_CHROME_URL: "http://127.0.0.1:9222"
    restart: unless-stopped

  # Sidecar de Tor — SEMPRE no ar junto do reconhub (sem precisar de
  # --profile). SOCKS5 em 127.0.0.1:9050, controle em 127.0.0.1:9051, dentro
  # do mesmo namespace de rede do reconhub (network_mode abaixo), então
  # essas portas nunca ficam expostas pro host nem pra fora do container.
  # Disponível o tempo todo; usá-lo continua opt-in por programa (ver acima).
  tor:
    build:
      context: ./docker/tor
    image: reconhub-tor:local
    container_name: reconhub-tor
    network_mode: "service:reconhub"
    depends_on:
      - reconhub
    restart: unless-stopped

  # Sidecar de Chrome headless — SEMPRE no ar junto do reconhub, mesmo
  # padrão do sidecar de Tor acima (network_mode compartilhado, nenhuma
  # porta exposta pro host). CDP em 127.0.0.1:9222, alcançável só de
  # dentro do container do hub via RECONHUB_CHROME_URL (setado acima no
  # serviço reconhub).
  chrome:
    build:
      context: ./docker/chrome
    image: reconhub-chrome:local
    container_name: reconhub-chrome
    network_mode: "service:reconhub"
    depends_on:
      - reconhub
    restart: unless-stopped

volumes:
  reconhub-data:
  reconhub-watches:
  reconhub-programs:
